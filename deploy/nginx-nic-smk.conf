# /etc/nginx/sites-available/nic-smk.conf
# http → https, www → nic-smk.ru, проксирование на Node (server.mjs, порт 4321).
# Сертификаты выпускает certbot (см. deploy/README.md).

upstream nicsmk { server 127.0.0.1:4321; keepalive 16; }

# http → https (для всех имён); certbot проходит через /.well-known
server {
  listen 80;
  listen [::]:80;
  server_name nic-smk.ru www.nic-smk.ru new.nic-smk.ru;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# www → основной домен
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.nic-smk.ru;
  ssl_certificate     /etc/letsencrypt/live/nic-smk.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nic-smk.ru/privkey.pem;
  return 301 https://nic-smk.ru$request_uri;
}

# Основной сайт
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name nic-smk.ru;
  ssl_certificate     /etc/letsencrypt/live/nic-smk.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nic-smk.ru/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 1m;

  location / {
    proxy_pass http://nicsmk;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}

# Тестовый адрес на время, пока домен смотрит на Tilda. Закрыт от индексации.
# После переключения DNS этот блок можно удалить.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name new.nic-smk.ru;
  ssl_certificate     /etc/letsencrypt/live/new.nic-smk.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/new.nic-smk.ru/privkey.pem;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
  location / {
    proxy_pass http://nicsmk;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
